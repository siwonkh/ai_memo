name: Build OpenH264 JS

on:
  push:
    branches:
      - openh264-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone OpenH264 JS source
        run: git clone --depth 1 --recurse-submodules https://github.com/MrCreativ3001/openh264-js.git openh264-js

      - name: Build decoder with Emscripten
        working-directory: openh264-js
        run: docker compose run --rm openh264-build

      - name: Prepare distribution file
        working-directory: openh264-js
        run: |
          npm install
          npm run build
          test -s dist/decoder.js
          sha256sum dist/decoder.js | tee dist/SHA256SUMS.txt

      - name: Upload decoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: openh264-decoder
          path: |
            openh264-js/dist/decoder.js
            openh264-js/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
